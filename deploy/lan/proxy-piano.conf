# Installed on proxy.int.everla.st at /etc/nginx/conf.d/piano.conf.
# --- Piano practice app (CT 107, LAN only) ---

upstream piano_backend {
    server 192.168.50.57:80;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name piano.int.everla.st;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name piano.int.everla.st;

    ssl_certificate     /etc/letsencrypt/live/int.everla.st/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/int.everla.st/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # LAN only: private IPv4 ranges plus link-local/ULA IPv6.
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow fe80::/10;
    allow fc00::/7;
    deny all;

    location / {
        proxy_pass http://piano_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
